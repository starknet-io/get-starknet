packages:
  - packages/*
  - docs
onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@tailwindcss/oxide"
  - esbuild
catalog:
  "@starknet-io/types-js": "0.10.4"
  tsdown: ^0.21.9
  typescript: ^5.9.3
  vitest: ^4.1.12
# Security fixes that sit outside the parent's semver range (docs site only):
# katex via mermaid (^0.16), toml via vocs / remark-mdx-frontmatter (^3),
# @hono/node-server via vocs (^1.19; no patched 1.x release).
overrides:
  "@hono/node-server@<2.1.3": ^2.1.3
  katex@<0.18.2: ^0.18.2
  toml@<5.0.1: ^5.0.1
