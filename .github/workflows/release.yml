name: Release

on:
  push:
    branches:
      - master
      - develop

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  version:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: checkout code repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: update npm cli
        run: npm install -g npm@11

      - name: install dependencies
        run: pnpm install

      - name: run tests
        run: pnpm test

      - name: copy readme to every package
        run: echo "./packages/core/ ./packages/ui/" | xargs -n 1 cp README.md

      - name: Create Master Release
        if: github.ref == 'refs/heads/master'
        uses: changesets/action@v1
        with:
          version: pnpm run version
          commit: "chore: version bump"
          title: "Master branch version bump"
          publish: pnpm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Develop Release
        if: github.ref == 'refs/heads/develop'
        uses: changesets/action@v1
        with:
          version: pnpm run version
          commit: "chore: version bump"
          title: "Develop branch version bump"
          publish: pnpm run publish:next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
